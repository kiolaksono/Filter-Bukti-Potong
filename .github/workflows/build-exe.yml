name: Build filter_bukpot EXE

# Jalan otomatis tiap push ke main/master (yang menyentuh file ini atau
# filter_bukpot.py / requirements.txt), atau bisa dipicu manual lewat
# tab "Actions" -> "Build filter_bukpot EXE" -> "Run workflow".
# Kalau push disertai tag yang diawali "v" (misal v1.0.0), hasil .exe
# otomatis dilampirkan ke GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "filter_bukpot.py"
      - "requirements.txt"
      - ".github/workflows/build-filter-bukpot.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        run: >
          pyinstaller --onefile --console
          --name foldering-bupot
          filter_pdf_pph23.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: filter_bukpot-windows-exe
          path: dist/foldering-bupot.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/foldering-bupot.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
